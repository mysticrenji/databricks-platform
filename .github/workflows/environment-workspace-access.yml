name: Workspace feature entitlements
on:
  workflow_call:
    inputs:
      target_environment:
        type: string
        required: true
      target_workspace:
        type: string
        required: true
      deploy:
        type: boolean
        required: true
      retire:
        type: boolean
        default: false
      confirm_environment:
        type: string
        default: ''
permissions:
  contents: read
  id-token: write
  actions: read
jobs:
  plan:
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.target_environment == 'dev' && inputs.target_workspace == 'demo' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: dev-demo-plan
    env:
      EXPECTED_DEPLOYMENT_ROLE_ARN: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      STATE_REGION: ${{ vars.TF_STATE_REGION }}
      DATABRICKS_ACCOUNT_ID: ${{ vars.DATABRICKS_ACCOUNT_ID }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_AUTH_TYPE: oauth-m2m
      TF_IN_AUTOMATION: 'true'
      TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
      TARGET_WORKSPACE: ${{ inputs.target_workspace }}
      CONFIRM_ENVIRONMENT: ${{ inputs.confirm_environment }}
      RETIRE: ${{ inputs.retire }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: pip install -r AWS/databricks-foundation/tools/databricks-access/requirements-live.txt
      - name: Render feature matrix without cloud calls
        run: |
          python AWS/databricks-foundation/tools/databricks-access/terraform_entitlements.py render \
            --environment "$TARGET_ENVIRONMENT" --workspace "$TARGET_WORKSPACE" --artifacts "$RUNNER_TEMP/workspace-access-inputs"
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: '1.10.5'
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ vars.TF_STATE_REGION }}
      - name: Plan feature configuration or retirement
        shell: bash
        run: |
          action=plan
          if [[ "$RETIRE" == true ]]; then action=preview-destroy; fi
          python AWS/databricks-foundation/tools/databricks-access/terraform_entitlements.py "$action" \
            --environment "$TARGET_ENVIRONMENT" --workspace "$TARGET_WORKSPACE" \
            --state-bucket "$STATE_BUCKET" --state-region "$STATE_REGION" \
            --confirm-environment "$CONFIRM_ENVIRONMENT" --artifacts "$RUNNER_TEMP/workspace-access-plan"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dev-demo-workspace-access-retire-${{ inputs.retire }}
          path: |
            ${{ runner.temp }}/workspace-access-plan/terraform.tfplan
            ${{ runner.temp }}/workspace-access-plan/manifest.json
          retention-days: 1
          if-no-files-found: error
  apply:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && inputs.deploy && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.target_environment == 'dev' && inputs.target_workspace == 'demo' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: dev-demo-apply
    env:
      EXPECTED_DEPLOYMENT_ROLE_ARN: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      STATE_REGION: ${{ vars.TF_STATE_REGION }}
      DATABRICKS_ACCOUNT_ID: ${{ vars.DATABRICKS_ACCOUNT_ID }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_AUTH_TYPE: oauth-m2m
      ENVIRONMENT_YAML_APPLY_ENABLED: ${{ vars.ENVIRONMENT_YAML_APPLY_ENABLED }}
      ENVIRONMENT_YAML_DESTROY_ENABLED: ${{ vars.ENVIRONMENT_YAML_DESTROY_ENABLED }}
      GH_TOKEN: ${{ github.token }}
      TF_IN_AUTOMATION: 'true'
      TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
      TARGET_WORKSPACE: ${{ inputs.target_workspace }}
      CONFIRM_ENVIRONMENT: ${{ inputs.confirm_environment }}
      RETIRE: ${{ inputs.retire }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: pip install -r AWS/databricks-foundation/tools/databricks-access/requirements-live.txt
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: '1.10.5'
          terraform_wrapper: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dev-demo-workspace-access-retire-${{ inputs.retire }}
          path: ${{ runner.temp }}/workspace-access-plan
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ vars.TF_STATE_REGION }}
      - name: Check deployment or retirement policy and apply exact saved plan
        shell: bash
        run: |
          action=apply
          if [[ "$RETIRE" == true ]]; then action=destroy; fi
          python AWS/databricks-foundation/tools/databricks-access/terraform_entitlements.py "$action" \
            --environment "$TARGET_ENVIRONMENT" --workspace "$TARGET_WORKSPACE" \
            --state-bucket "$STATE_BUCKET" --state-region "$STATE_REGION" \
            --confirm-environment "$CONFIRM_ENVIRONMENT" --artifacts "$RUNNER_TEMP/workspace-access-plan"
